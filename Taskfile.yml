version: "3"

vars:
  PYTHON: '{{default (ternary "py -3.12" "python3" (eq OS "windows")) .PYTHON}}'
  CMAKE: '{{default (ternary "C:/Program Files/CMake/bin/cmake.exe" "cmake" (eq OS "windows")) .CMAKE}}'
  EXEC_PREFIX: '{{if eq OS "windows"}}{{else}}./{{end}}'
  ARM_GNU_TOOLCHAIN_ROOT: '{{default (ternary "" (printf "%s/.local/toolchains/arm-gnu-toolchain-15.2.rel1-darwin-arm64-arm-none-eabi" (env "HOME")) (eq OS "windows")) .ARM_GNU_TOOLCHAIN_ROOT}}'
  APP_HEAP_SIZE: '{{default "0x200" .APP_HEAP_SIZE}}'
  APP_STACK_SIZE: '{{default "0x800" .APP_STACK_SIZE}}'
  MAP_FILE: '{{default "artifacts/cmake/firmware-release/stm32f030_app.map" .MAP_FILE}}'
  TEMPLATE_NAME: '{{default "firmware-stm32f0" .TEMPLATE_NAME}}'
  PROJECT_NAME: '{{default "sample-project" .PROJECT_NAME}}'
  PRODUCT_FAMILY: '{{default "bms-family" .PRODUCT_FAMILY}}'
  BOARD_CODE: '{{default "board-default" .BOARD_CODE}}'
  AFE_CODE: '{{default "afe-default" .AFE_CODE}}'
  DEVICE_CODE: '{{default "STM32F030C8" .DEVICE_CODE}}'
  PROTOCOL_VARIANT: '{{default "default" .PROTOCOL_VARIANT}}'
  CUSTOMER_CODE: '{{default "common" .CUSTOMER_CODE}}'
  FIRMWARE_HEX: '{{default "artifacts/cmake/firmware-release/CommomSH367309_16series_030C8T6_C.hex" .FIRMWARE_HEX}}'
  FIRMWARE_BIN: '{{default "artifacts/cmake/firmware-release/CommomSH367309_16series_030C8T6_C.bin" .FIRMWARE_BIN}}'
  PROBE: '{{default "auto" .PROBE}}'
  VARS_FILE: '{{default "templates/vars.sample.json" .VARS_FILE}}'
  OPENOCD: '{{default (ternary "C:/Users/Administrator/AppData/Local/Microsoft/WinGet/Packages/xpack-dev-tools.openocd-xpack_Microsoft.Winget.Source_8wekyb3d8bbwe/xpack-openocd-0.12.0-7/bin/openocd.exe" "/opt/homebrew/bin/openocd" (eq OS "windows")) .OPENOCD}}'
  OPENOCD_SCRIPTS: '{{default (ternary "C:/Users/Administrator/AppData/Local/Microsoft/WinGet/Packages/xpack-dev-tools.openocd-xpack_Microsoft.Winget.Source_8wekyb3d8bbwe/xpack-openocd-0.12.0-7/openocd/scripts" "/opt/homebrew/share/openocd/scripts" (eq OS "windows")) .OPENOCD_SCRIPTS}}'
  STM32_PROGRAMMER: '{{default "C:/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin/STM32_Programmer_CLI.exe" .STM32_PROGRAMMER}}'

tasks:
  default:
    desc: 显示可用任务
    cmds:
      - task --list

  doctor:
    desc: 检查跨平台工具链是否齐备
    cmds:
      - "{{.PYTHON}} scripts/check_toolchain.py"

  init:
    desc: 初始化 Python 工具环境
    cmds:
      - '{{if eq OS "windows"}}{{.PYTHON}} -m pip install uv{{else}}python3 -c "import shutil, sys; sys.exit(0 if shutil.which(\"uv\") else 1)" || python3 -m pip install --user uv{{end}}'
      - uv sync --no-install-project

  build:
    desc: 使用板级安全 Preset 构建 STM32F030 固件，尽量贴近 Keil 行为
    cmds:
      - '"{{.CMAKE}}" --fresh --preset firmware-release {{if .ARM_GNU_TOOLCHAIN_ROOT}}-DARM_GNU_TOOLCHAIN_ROOT="{{.ARM_GNU_TOOLCHAIN_ROOT}}"{{end}} -DAPP_HEAP_SIZE="{{.APP_HEAP_SIZE}}" -DAPP_STACK_SIZE="{{.APP_STACK_SIZE}}"'
      - '"{{.CMAKE}}" --build --preset build-firmware-release'

  build-optimized:
    desc: 使用优化 Preset 构建 STM32F030 固件，包含 LTO 与运行时监控
    cmds:
      - '"{{.CMAKE}}" --fresh --preset firmware-optimized {{if .ARM_GNU_TOOLCHAIN_ROOT}}-DARM_GNU_TOOLCHAIN_ROOT="{{.ARM_GNU_TOOLCHAIN_ROOT}}"{{end}} -DAPP_HEAP_SIZE="{{.APP_HEAP_SIZE}}" -DAPP_STACK_SIZE="{{.APP_STACK_SIZE}}"'
      - '"{{.CMAKE}}" --build --preset build-firmware-optimized'

  build-monitor:
    desc: 使用监控 Preset 构建 STM32F030 固件，启用运行时快照且关闭 LTO
    cmds:
      - '"{{.CMAKE}}" --fresh --preset firmware-monitor {{if .ARM_GNU_TOOLCHAIN_ROOT}}-DARM_GNU_TOOLCHAIN_ROOT="{{.ARM_GNU_TOOLCHAIN_ROOT}}"{{end}} -DAPP_HEAP_SIZE="{{.APP_HEAP_SIZE}}" -DAPP_STACK_SIZE="{{.APP_STACK_SIZE}}"'
      - '"{{.CMAKE}}" --build --preset build-firmware-monitor'

  build-debug:
    desc: 使用 CMake Debug Preset 构建 STM32F030 固件
    cmds:
      - '"{{.CMAKE}}" --fresh --preset firmware-debug {{if .ARM_GNU_TOOLCHAIN_ROOT}}-DARM_GNU_TOOLCHAIN_ROOT="{{.ARM_GNU_TOOLCHAIN_ROOT}}"{{end}} -DAPP_HEAP_SIZE="{{.APP_HEAP_SIZE}}" -DAPP_STACK_SIZE="{{.APP_STACK_SIZE}}"'
      - '"{{.CMAKE}}" --build --preset build-firmware-debug'

  build-check:
    desc: 检查当前 GCC 板级安全构建与 Keil 的源文件/宏定义差异
    cmds:
      - '{{.PYTHON}} scripts/check_build_alignment.py --mode board-safe --json artifacts/build-alignment-board-safe.json'

  build-check-optimized:
    desc: 检查当前 GCC 优化构建与 Keil 的源文件/宏定义差异
    cmds:
      - '{{.PYTHON}} scripts/check_build_alignment.py --mode optimized --json artifacts/build-alignment-optimized.json'

  rebuild:
    desc: 清理后重新执行固件构建
    cmds:
      - task: clean
      - task: build

  rebuild-debug:
    desc: 清理后重新执行固件 Debug 构建
    cmds:
      - task: clean
      - task: build-debug

  clean:
    desc: 清理自动化生成物目录
    cmds:
      - '{{.PYTHON}} scripts/export_artifacts.py --source-root . --output artifacts/build-plan.json --clean'

  lint:
    desc: 执行基础脚本自检
    cmds:
      - "{{.PYTHON}} -m compileall scripts"

  format:
    desc: 检查模板替换脚本
    cmds:
      - '{{.PYTHON}} scripts/patch_project.py --check-only --project-root . --vars-file "{{.VARS_FILE}}"'

  test:
    desc: 执行自动化骨架自检
    cmds:
      - "{{.PYTHON}} scripts/new_project.py --help"
      - "{{.PYTHON}} scripts/analyze_map.py --help"
      - "{{.PYTHON}} scripts/analyze_build_summary.py --help"
      - "{{.PYTHON}} scripts/analyze_protection_replay.py --help"
      - "{{.PYTHON}} scripts/analyze_soc_replay.py --help"
      - "{{.PYTHON}} scripts/debug_capture.py --help"
      - "{{.PYTHON}} scripts/check_toolchain.py"

  map:
    desc: 分析 map 文件热点
    cmds:
      - '{{.PYTHON}} scripts/analyze_map.py --map "{{.MAP_FILE}}" --top 20 --json artifacts/map-summary.json --md artifacts/map-summary.md'

  build-summary:
    desc: 执行固件构建并生成 build warning/error 摘要
    cmds:
      - '{{.PYTHON}} scripts/analyze_build_summary.py --cmake "{{.CMAKE}}" --configure-preset firmware-release --build-preset build-firmware-release {{if .ARM_GNU_TOOLCHAIN_ROOT}}--arm-gnu-toolchain-root "{{.ARM_GNU_TOOLCHAIN_ROOT}}"{{end}} --app-heap-size "{{.APP_HEAP_SIZE}}" --app-stack-size "{{.APP_STACK_SIZE}}" --map "{{.MAP_FILE}}" --log artifacts/build-summary.log --json artifacts/build-summary.json --md artifacts/build-summary.md'

  flash:
    desc: 生成烧录命令计划，工具存在时可扩展为直接执行
    cmds:
      - '{{.PYTHON}} scripts/debug_capture.py flash --probe "{{.PROBE}}" --artifact "{{.FIRMWARE_HEX}}" --output artifacts/flash-plan.md'

  debug:
    desc: 生成调试命令计划，工具存在时可扩展为直接执行
    cmds:
      - '{{.PYTHON}} scripts/debug_capture.py debug --probe "{{.PROBE}}" --artifact "{{.FIRMWARE_HEX}}" --output artifacts/debug-plan.md'

  sim-modbus:
    desc: 在 PC 上构建并运行 Modbus 解析主机侧仿真
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/modbus_parser_host_test{{if eq OS "windows"}}.exe{{end}}'

  sim-replay:
    desc: 在 PC 上回放 Modbus 帧并生成日志与快照
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/modbus_parser_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/modbus_frames.txt --log artifacts/host-sim/modbus-replay.log --snapshot artifacts/host-sim/modbus-replay.jsonl --repeat 1'

  sim-replay-long:
    desc: 长时间回放 Modbus 帧并仅落日志与快照
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/modbus_parser_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/modbus_frames.txt --log artifacts/host-sim/modbus-replay-long.log --snapshot artifacts/host-sim/modbus-replay-long.jsonl --repeat 10000 --quiet-console'

  sim-replay-watch:
    desc: 在终端持续输出 Modbus 回放日志，并同时落文件
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/modbus_parser_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/modbus_frames.txt --log artifacts/host-sim/modbus-replay-watch.log --snapshot artifacts/host-sim/modbus-replay-watch.jsonl --repeat 10000'

  sim-scheduler:
    desc: 在 PC 上运行共享调度器仿真并输出周期任务日志与快照
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/scheduler_host_replay{{if eq OS "windows"}}.exe{{end}} --ticks 1000 --log artifacts/host-sim/scheduler-replay.log --snapshot artifacts/host-sim/scheduler-replay.jsonl'

  sim-scheduler-long:
    desc: 在 PC 上长期运行共享调度器仿真并输出周期任务日志与快照
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/scheduler_host_replay{{if eq OS "windows"}}.exe{{end}} --ticks 50000 --log artifacts/host-sim/scheduler-replay-long.log --snapshot artifacts/host-sim/scheduler-replay-long.jsonl --quiet-console'

  sim-scheduler-watch:
    desc: 在终端持续输出共享调度器仿真日志，并同时落文件
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/scheduler_host_replay{{if eq OS "windows"}}.exe{{end}} --ticks 50000 --log artifacts/host-sim/scheduler-replay-watch.log --snapshot artifacts/host-sim/scheduler-replay-watch.jsonl'

  sim-protection:
    desc: 在 PC 上回放第一版保护策略场景并输出日志与快照
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/protection_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/protection/protection_basic.csv --log artifacts/host-sim/protection-replay.log --snapshot artifacts/host-sim/protection-replay.jsonl'

  sim-protection-watch:
    desc: 在终端持续输出第一版保护策略场景结果，并同时落文件
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/protection_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/protection/protection_basic.csv --log artifacts/host-sim/protection-replay-watch.log --snapshot artifacts/host-sim/protection-replay-watch.jsonl'

  sim-protection-ovp-uvp:
    desc: 在 PC 上回放单体 OVP/UVP 保护场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/protection_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/protection/protection_ovp_uvp.csv --log artifacts/host-sim/protection-ovp-uvp.log --snapshot artifacts/host-sim/protection-ovp-uvp.jsonl'

  sim-protection-ocp:
    desc: 在 PC 上回放充放电 OCP 保护场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/protection_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/protection/protection_ocp.csv --log artifacts/host-sim/protection-ocp.log --snapshot artifacts/host-sim/protection-ocp.jsonl'

  sim-protection-otp-utp:
    desc: 在 PC 上回放温度保护场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/protection_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/protection/protection_otp_utp.csv --log artifacts/host-sim/protection-otp-utp.log --snapshot artifacts/host-sim/protection-otp-utp.jsonl'

  sim-protection-pack:
    desc: 在 PC 上回放 pack 电压、压差和 SOC 保护场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/protection_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/protection/protection_pack_soc_vdelta.csv --log artifacts/host-sim/protection-pack.log --snapshot artifacts/host-sim/protection-pack.jsonl'

  sim-protection-suite:
    desc: 在 PC 上顺序执行整套保护策略回归
    cmds:
      - task: sim-protection-ovp-uvp
      - task: sim-protection-ocp
      - task: sim-protection-otp-utp
      - task: sim-protection-pack

  sim-protection-summary:
    desc: 汇总整套保护回归结果，生成可供 Codex 读取的摘要
    cmds:
      - '{{.PYTHON}} scripts/analyze_protection_replay.py --input artifacts/host-sim/protection-ovp-uvp.jsonl --input artifacts/host-sim/protection-ocp.jsonl --input artifacts/host-sim/protection-otp-utp.jsonl --input artifacts/host-sim/protection-pack.jsonl --json artifacts/host-sim/protection-suite-summary.json --markdown artifacts/host-sim/protection-suite-summary.md'

  sim-protection-suite-summary:
    desc: 顺序执行整套保护回归并生成摘要
    cmds:
      - task: sim-protection-suite
      - task: sim-protection-summary

  sim-soc:
    desc: 在 PC 上回放第一版 SOC 策略场景并输出日志与快照
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_mixed_cycle.csv --log artifacts/host-sim/soc-replay.log --snapshot artifacts/host-sim/soc-replay.jsonl'

  sim-soc-charge:
    desc: 在 PC 上回放 SOC 充电场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_charge.csv --log artifacts/host-sim/soc-charge.log --snapshot artifacts/host-sim/soc-charge.jsonl'

  sim-soc-discharge:
    desc: 在 PC 上回放 SOC 放电场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_discharge.csv --log artifacts/host-sim/soc-discharge.log --snapshot artifacts/host-sim/soc-discharge.jsonl'

  sim-soc-idle:
    desc: 在 PC 上回放 SOC 静置 OCV 修正场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_idle_ocv.csv --log artifacts/host-sim/soc-idle.log --snapshot artifacts/host-sim/soc-idle.jsonl'

  sim-soc-mixed:
    desc: 在 PC 上回放 SOC 充放切换与静置混合场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_mixed_cycle.csv --log artifacts/host-sim/soc-mixed.log --snapshot artifacts/host-sim/soc-mixed.jsonl'

  sim-soc-restore:
    desc: 在 PC 上回放 SOC 掉电恢复场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_power_restore.csv --log artifacts/host-sim/soc-restore.log --snapshot artifacts/host-sim/soc-restore.jsonl'

  sim-soc-long:
    desc: 在 PC 上长时间回放 SOC 漂移场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_long_drift.csv --repeat 20 --log artifacts/host-sim/soc-long.log --snapshot artifacts/host-sim/soc-long.jsonl --quiet-console'

  sim-soc-cycle:
    desc: 在 PC 上回放 SOC 循环统计场景
    cmds:
      - '"{{.CMAKE}}" --preset host-sim-debug'
      - '"{{.CMAKE}}" --build --preset build-host-sim-debug'
      - '{{.EXEC_PREFIX}}artifacts/cmake/host-sim-debug/host_sim/soc_host_replay{{if eq OS "windows"}}.exe{{end}} --input host_sim/scenarios/soc/soc_cycle_counter.csv --initial-soc-pct-x10 1000 --log artifacts/host-sim/soc-cycle.log --snapshot artifacts/host-sim/soc-cycle.jsonl'

  sim-soc-suite:
    desc: 在 PC 上顺序执行整套 SOC 回归
    cmds:
      - task: sim-soc-charge
      - task: sim-soc-discharge
      - task: sim-soc-idle
      - task: sim-soc-mixed
      - task: sim-soc-restore
      - task: sim-soc-long
      - task: sim-soc-cycle

  sim-soc-summary:
    desc: 汇总整套 SOC 回归结果，生成可供 Codex 读取的摘要
    cmds:
      - '{{.PYTHON}} scripts/analyze_soc_replay.py --input artifacts/host-sim/soc-charge.jsonl --input artifacts/host-sim/soc-discharge.jsonl --input artifacts/host-sim/soc-idle.jsonl --input artifacts/host-sim/soc-mixed.jsonl --input artifacts/host-sim/soc-restore.jsonl --input artifacts/host-sim/soc-long.jsonl --input artifacts/host-sim/soc-cycle.jsonl --json artifacts/host-sim/soc-suite-summary.json --markdown artifacts/host-sim/soc-suite-summary.md'

  sim-soc-suite-summary:
    desc: 顺序执行整套 SOC 回归并生成摘要
    cmds:
      - task: sim-soc-suite
      - task: sim-soc-summary

  flash-stlink:
    desc: 使用 ST-Link + OpenOCD 烧录 GCC 生成的固件
    cmds:
      - '{{.PYTHON}} scripts/flash_stlink.py --openocd "{{.OPENOCD}}" --scripts-dir "{{.OPENOCD_SCRIPTS}}" --artifact "{{.FIRMWARE_BIN}}" --address 0x08001C00'

  flash-stlink-monitor:
    desc: 使用 STM32CubeProgrammer 烧录监控版固件
    cmds:
      - '{{.PYTHON}} scripts/flash_stm32cube.py --programmer "{{.STM32_PROGRAMMER}}" --artifact "artifacts/cmake/firmware-monitor/CommomSH367309_16series_030C8T6_C.bin" --address 0x08001C00'

  watch-board-stlink:
    desc: 通过 ST-Link/OpenOCD 轮询板上运行时快照并在终端持续输出
    cmds:
      - '{{.PYTHON}} scripts/watch_board_status.py --openocd "{{.OPENOCD}}" --scripts-dir "{{.OPENOCD_SCRIPTS}}" --elf "artifacts/cmake/firmware-monitor/firmware/CommomSH367309_16series_030C8T6_C.elf" --halt-sample'

  new:
    desc: 基于模板生成新项目骨架
    cmds:
      - '{{.PYTHON}} scripts/new_project.py --template "{{.TEMPLATE_NAME}}" --project-name "{{.PROJECT_NAME}}" --product-family "{{.PRODUCT_FAMILY}}" --board-code "{{.BOARD_CODE}}" --afe-code "{{.AFE_CODE}}" --device-code "{{.DEVICE_CODE}}" --protocol-variant "{{.PROTOCOL_VARIANT}}" --customer-code "{{.CUSTOMER_CODE}}" --output templates/generated/{{.PROJECT_NAME}}'

  patch:
    desc: 对现有项目执行占位符替换
    cmds:
      - '{{.PYTHON}} scripts/patch_project.py --project-root . --vars-file "{{.VARS_FILE}}"'
