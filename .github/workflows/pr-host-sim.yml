name: PR Host Sim Review

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - "codex/**"
  workflow_dispatch:

jobs:
  host-sim-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Host Sim Modbus
        run: |
          cmake --preset host-sim-debug
          cmake --build --preset build-host-sim-debug
          ./artifacts/cmake/host-sim-debug/host_sim/modbus_parser_host_test

      - name: Host Sim Protection Suite Summary
        run: |
          cmake --preset host-sim-debug
          cmake --build --preset build-host-sim-debug
          ./artifacts/cmake/host-sim-debug/host_sim/protection_host_replay \
            --input host_sim/scenarios/protection/protection_ovp_uvp.csv \
            --log artifacts/host-sim/protection-ovp-uvp.log \
            --snapshot artifacts/host-sim/protection-ovp-uvp.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/protection_host_replay \
            --input host_sim/scenarios/protection/protection_ocp.csv \
            --log artifacts/host-sim/protection-ocp.log \
            --snapshot artifacts/host-sim/protection-ocp.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/protection_host_replay \
            --input host_sim/scenarios/protection/protection_otp_utp.csv \
            --log artifacts/host-sim/protection-otp-utp.log \
            --snapshot artifacts/host-sim/protection-otp-utp.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/protection_host_replay \
            --input host_sim/scenarios/protection/protection_pack_soc_vdelta.csv \
            --log artifacts/host-sim/protection-pack.log \
            --snapshot artifacts/host-sim/protection-pack.jsonl
          python3 scripts/analyze_protection_replay.py \
            --input artifacts/host-sim/protection-ovp-uvp.jsonl \
            --input artifacts/host-sim/protection-ocp.jsonl \
            --input artifacts/host-sim/protection-otp-utp.jsonl \
            --input artifacts/host-sim/protection-pack.jsonl \
            --json artifacts/host-sim/protection-suite-summary.json \
            --markdown artifacts/host-sim/protection-suite-summary.md

      - name: Host Sim SOC Suite Summary
        run: |
          cmake --preset host-sim-debug
          cmake --build --preset build-host-sim-debug
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_charge.csv \
            --log artifacts/host-sim/soc-charge.log \
            --snapshot artifacts/host-sim/soc-charge.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_discharge.csv \
            --log artifacts/host-sim/soc-discharge.log \
            --snapshot artifacts/host-sim/soc-discharge.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_idle_ocv.csv \
            --log artifacts/host-sim/soc-idle.log \
            --snapshot artifacts/host-sim/soc-idle.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_mixed_cycle.csv \
            --log artifacts/host-sim/soc-mixed.log \
            --snapshot artifacts/host-sim/soc-mixed.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_power_restore.csv \
            --log artifacts/host-sim/soc-restore.log \
            --snapshot artifacts/host-sim/soc-restore.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_long_drift.csv \
            --repeat 20 \
            --log artifacts/host-sim/soc-long.log \
            --snapshot artifacts/host-sim/soc-long.jsonl \
            --quiet-console
          ./artifacts/cmake/host-sim-debug/host_sim/soc_host_replay \
            --input host_sim/scenarios/soc/soc_cycle_counter.csv \
            --initial-soc-pct-x10 1000 \
            --log artifacts/host-sim/soc-cycle.log \
            --snapshot artifacts/host-sim/soc-cycle.jsonl
          python3 scripts/analyze_soc_replay.py \
            --input artifacts/host-sim/soc-charge.jsonl \
            --input artifacts/host-sim/soc-discharge.jsonl \
            --input artifacts/host-sim/soc-idle.jsonl \
            --input artifacts/host-sim/soc-mixed.jsonl \
            --input artifacts/host-sim/soc-restore.jsonl \
            --input artifacts/host-sim/soc-long.jsonl \
            --input artifacts/host-sim/soc-cycle.jsonl \
            --json artifacts/host-sim/soc-suite-summary.json \
            --markdown artifacts/host-sim/soc-suite-summary.md

      - name: Host Sim Low Power Suite Summary
        run: |
          cmake --preset host-sim-debug
          cmake --build --preset build-host-sim-debug
          ./artifacts/cmake/host-sim-debug/host_sim/low_power_host_replay \
            --input host_sim/scenarios/low_power/low_power_normal.csv \
            --log artifacts/host-sim/low-power-normal.log \
            --snapshot artifacts/host-sim/low-power-normal.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/low_power_host_replay \
            --input host_sim/scenarios/low_power/low_power_low_v.csv \
            --log artifacts/host-sim/low-power-low-v.log \
            --snapshot artifacts/host-sim/low-power-low-v.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/low_power_host_replay \
            --input host_sim/scenarios/low_power/low_power_wake.csv \
            --log artifacts/host-sim/low-power-wake.log \
            --snapshot artifacts/host-sim/low-power-wake.jsonl
          ./artifacts/cmake/host-sim-debug/host_sim/low_power_host_replay \
            --input host_sim/scenarios/low_power/low_power_deep.csv \
            --log artifacts/host-sim/low-power-deep.log \
            --snapshot artifacts/host-sim/low-power-deep.jsonl
          python3 scripts/analyze_low_power_replay.py \
            --input artifacts/host-sim/low-power-normal.jsonl \
            --input artifacts/host-sim/low-power-low-v.jsonl \
            --input artifacts/host-sim/low-power-wake.jsonl \
            --input artifacts/host-sim/low-power-deep.jsonl \
            --json artifacts/host-sim/low-power-suite-summary.json \
            --markdown artifacts/host-sim/low-power-suite-summary.md

      - name: Codex Overview Summary
        run: |
          python3 scripts/analyze_codex_overview.py \
            --build-summary artifacts/build-summary.json \
            --map-summary artifacts/map-summary.json \
            --protection-summary artifacts/host-sim/protection-suite-summary.json \
            --soc-summary artifacts/host-sim/soc-suite-summary.json \
            --low-power-summary artifacts/host-sim/low-power-suite-summary.json \
            --json artifacts/codex-overview.json \
            --markdown artifacts/codex-overview.md

      - name: Upload Host Sim Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-host-sim-artifacts
          path: |
            artifacts/host-sim/protection-*.log
            artifacts/host-sim/protection-*.jsonl
            artifacts/host-sim/protection-suite-summary.json
            artifacts/host-sim/protection-suite-summary.md
            artifacts/host-sim/soc-*.log
            artifacts/host-sim/soc-*.jsonl
            artifacts/host-sim/soc-suite-summary.json
            artifacts/host-sim/soc-suite-summary.md
            artifacts/host-sim/low-power-*.log
            artifacts/host-sim/low-power-*.jsonl
            artifacts/host-sim/low-power-suite-summary.json
            artifacts/host-sim/low-power-suite-summary.md
            artifacts/codex-overview.json
            artifacts/codex-overview.md
